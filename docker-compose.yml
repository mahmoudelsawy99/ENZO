services:
  mongo:
    image: mongo:7
    volumes:
      - enzo-mongo:/data/db
  api:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/enzo
    depends_on:
      - mongo
    ports:
      - "3000:3000"
  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  enzo-mongo:
